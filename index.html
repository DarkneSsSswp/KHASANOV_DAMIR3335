<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #todoList {
            border-collapse: collapse;
            width: 70%;
            margin: 0 auto;
        }
        #todoList th, #todoList td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        #todoList th {
            background-color: #f0f0f0;
        }
        #todoList th:first-child, #todoList th:last-child {
            width: 5%;
        }
        #todoList th:nth-child(2) {
            width: 90%;
        }
        .edit-input {
            width: 90%;
            padding: 4px;
        }
        .save-btn {
            padding: 4px 8px;
        }
    </style>
</head>
<body>

<h2 style="text-align: center;">To-Do List</h2>

<table id="todoList">
    <thead>
        <tr>
            <th>Number</th>
            <th>Text</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody id="listBody">
        {{rows}}
    </tbody>
</table>

<script>
    function enableEdit(id, currentText) {
        const row = document.getElementById('row-' + id);
        row.innerHTML = `
            <td>${id}</td>
            <td><input type="text" id="edit-${id}" class="edit-input" value="${currentText}"></td>
            <td><button class="save-btn" onclick="saveEdit(${id})">Save</button></td>
        `;
    }

    function saveEdit(id) {
        const newText = document.getElementById('edit-' + id).value.trim();

        if (newText) {
            fetch('/edit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ id, text: newText })
            })
            .then(response => {
                if (response.ok) {
                    window.location.reload();
                } else {
                    alert('Failed to update item');
                }
            });
        }
    }
</script>

</body>
</html>
